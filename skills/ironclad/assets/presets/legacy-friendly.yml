name: legacy-friendly
title: Legacy-friendly — brownfield, existing debt
description: >
  For repos that already have hundreds of violations. Nothing blocks on the first
  run; everything is reported. Gate only new files. Switch to balanced once the
  baseline is clean.
rules:
  DB-01: warn
  DB-02: warn
  DB-03: warn
  DB-04: warn
  DB-05: warn
  DB-06: warn
  DB-07: warn
  DB-08: warn
  API-01: warn
  API-02: warn
  API-06: warn
  API-07: warn
  SEC-01: warn
  SEC-02: warn
  SEC-03: warn
  # Off in this preset on purpose: an older codebase has cycles it will not fix
  # this quarter, and a first run that opens with 40 of them is a first run
  # nobody repeats.
  ARCH-01: off
  ARCH-02: off

exceptions: []
boolean_allowlist:
  - is_active
  - is_deleted
  - is_published
  - is_verified
  - is_terminal
  - has_invoice
  - is_archived
  - is_default
