name: strict
title: Strict — regulated / audit-bearing systems
description: >
  Every rule blocks. No exceptions accepted without an allowlist entry. Use where
  a schema migration is a compliance event: finance, health, anything with an
  audit trail that outlives the team.
rules:
  DB-01: error
  DB-02: error
  DB-03: error      # missing FK/CHECK blocks even without --strict
  DB-04: error
  DB-05: error
  DB-06: error      # money as float
  DB-07: error      # timestamp without timezone
  DB-08: error      # project mixes status styles
  API-01: error
  API-02: error
  API-06: error
  API-07: error
  SEC-01: error
  SEC-02: error
  SEC-03: error
  # Architecture: a cycle is legal to write and always worth blocking before merge
  # in a strict repo, because it makes module load order a matter of luck.
  ARCH-01: error
  ARCH-02: error

exceptions: []
boolean_allowlist:
  - is_active
  - is_deleted
  - is_verified
  - is_terminal
