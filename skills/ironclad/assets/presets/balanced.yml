name: balanced
title: Balanced — recommended default
description: >
  The default. Enums are rejected but a written justification in the migration
  comment is accepted on review. Status columns must carry a constraint; that
  check warns instead of blocking so legacy tables do not stop a build. Boolean
  naming is advisory.
rules:
  DB-01: error      # enum without justification
  DB-02: error      # magic number compared to a status field
  DB-03: warn       # status integer with no FK/CHECK (blocks only with --strict)
  DB-04: error      # status stored as text
  DB-05: warn       # boolean named for a non-binary concept
  DB-06: warn       # money stored as float/double
  DB-07: warn       # timestamp without a timezone
  DB-08: warn       # project mixes enum/integer/text for the same concept
# --- API domain (Phase 2). Every one of these is silent on a repo that is
# consistent with itself; they fire on disagreement, not on taste.
  API-01: warn      # endpoint paths named in more than one style
  API-02: warn      # error payload returned with a 2xx status
  API-06: warn      # OpenAPI document no longer matches the routes
  API-07: error     # the same route declared twice — one can never run
  # --- security domain. Silence is the correct output for a repo that keeps its
  # credentials out of the tree; these fire on evidence, not on suspicion.
  SEC-01: error     # credentials in a file git could ship
  SEC-02: error     # credential hardcoded in source
  SEC-03: warn      # .env.example no longer documents what .env needs
exceptions: []
boolean_allowlist:
  - is_active
  - is_deleted
  - is_published
  - is_verified
  - is_terminal
  - has_invoice
