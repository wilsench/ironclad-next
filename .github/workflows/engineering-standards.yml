name: self-test

# This repo ships a linter, so CI should prove the linter itself still works —
# not run it against a repo that has no `.agent/standards.yml`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile skills/ironclad/scripts/*.py

      - name: Presets are readable
        run: |
          OUT=$(python skills/ironclad/scripts/check_schema.py --list-presets)
          echo "$OUT"
          grep -q '^balanced' <<< "$OUT"
          grep -q '^strict' <<< "$OUT"
          grep -q '^legacy-friendly' <<< "$OUT"

      - name: Fixture that must pass
        run: python skills/ironclad/scripts/check_schema.py examples/good.sql --preset strict

      - name: Fixture that must fail
        run: |
          if python skills/ironclad/scripts/check_schema.py examples/bad.sql --preset strict; then
            echo "::error::examples/bad.sql was expected to fail and did not — the checker regressed"
            exit 1
          fi

      - name: Presets actually change severity
        run: |
          python skills/ironclad/scripts/check_schema.py examples/bad.sql --preset legacy-friendly \
            || { echo "::error::legacy-friendly must exit 0"; exit 1; }

      # The regression guard for everything found by auditing: crashes on real
      # repos, HTTP codes mistaken for schema, one-line enum, multi-line FK.
      # Without this step CI only proves the fixtures in examples/ still behave.
      - name: Self-test the gate itself
        run: python skills/ironclad/scripts/drill.py --selftest

      # False passes found by the 0.10.2 audit: an install that shipped an
      # incomplete payload, and a --preset flag that was silently ignored.
      # These are the failures a green build used to hide, so they get their
      # own step rather than living inside the selftest.
      - name: Regressions — no false passes
        run: python tests/test_regressions.py

      - name: Bootstrap works from a clean dir
        run: |
          rm -rf /tmp/ic && mkdir -p /tmp/ic && cd /tmp/ic
          printf '' | python3 "$GITHUB_WORKSPACE/skills/ironclad/scripts/init_standards.py" . --with-checker
          test -f .agent/standards.yml
          test -f scripts/presets/strict.yml
          python3 scripts/check_schema.py --list-presets
